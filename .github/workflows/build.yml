name: Build static i386 gdbserver

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build in 32-bit Debian container
        run: |
          docker build --pull --platform linux/386 -t gdbserver-static-builder .
          docker run --rm --platform linux/386 \
            -v "$PWD:/workspace" gdbserver-static-builder
      - name: Record container image
        run: |
          docker image inspect gdbserver-static-builder --format 'Builder image ID: {{.Id}}' >> dist/BUILDINFO.txt
          cat dist/BUILDINFO.txt
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/gdbserver-9.2-linux-i386-static
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdbserver-9.2-linux-i386-static
          path: dist/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "GDBserver 9.2 static i386" \
            --notes-file RELEASE_NOTES.md

